name: Build iOS Binary

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build_ios:
    name: Build for iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - run: brew install ldid cmake
      - run: ./tools/build-ios.sh "ipatool-ios-arm64"
        env:
          VERSION: "2.8.1-fixed"
      - uses: actions/upload-artifact@v4
        with:
          name: ipatool-ios-arm64
          path: ipatool-ios-arm64
          if-no-files-found: error
